<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Un saut qui fait envie — les ficelles, côte à côte</title>
<script>if (window.self !== window.top || /[?&]embed(&|=|$)/.test(location.search)) document.documentElement.classList.add("embed");</script>
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap");

:root {
    --sae-red: #E30613;
    --sae-black: #1a1a1a;
    --sae-white: #ffffff;
    --sae-gray: #888888;

    --bg: var(--sae-white);
    --panel: #ffffff;
    --panel2: #f5f5f5;
    --line: #e2e2e2;

    --text: var(--sae-black);
    --muted: #555555;
    --muted2: var(--sae-gray);
    --vert: #2e9e5b;

    --shadow: 0 1px 2px rgba(26, 26, 26, .04), 0 4px 12px rgba(26, 26, 26, .06);
    --radius: 6px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
}

.wrap { max-width: 1280px; margin: 0 auto; padding: 28px 22px 40px; }

header {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 20px; flex-wrap: wrap; margin-bottom: 16px;
    padding-bottom: 14px; border-bottom: 3px solid var(--sae-red);
}
h1 {
    font-weight: 800; font-size: clamp(22px, 3vw, 34px);
    letter-spacing: -.01em; line-height: 1; text-transform: uppercase;
}
h1 .hl { color: var(--sae-red); }
.sub { color: var(--muted); font-size: 14px; margin-top: 8px; max-width: 700px; line-height: 1.5; }

.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.tabs button {
    font: 600 13.5px "Inter", sans-serif; color: var(--muted);
    background: #fff; border: 2px solid var(--line); border-radius: 999px;
    padding: 7px 15px; cursor: pointer; transition: border-color .12s, background .12s;
}
.tabs button:hover { border-color: var(--muted2); color: var(--sae-black); }
.tabs button.on { border-color: var(--sae-black); background: var(--sae-black); color: #fff; }

.scene {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px;
}
.scene canvas { width: 100%; height: auto; display: block; image-rendering: pixelated; }

.barre {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line);
}
.go {
    font: 800 14px "Inter", sans-serif; color: #fff; background: var(--sae-red);
    border: none; border-radius: var(--radius); padding: 10px 20px; cursor: pointer;
}
.go:hover { filter: brightness(1.08); }
.consigne { font-size: 13.5px; color: var(--muted); flex: 1; min-width: 240px; }
.consigne b { color: var(--sae-black); }

.verdict {
    margin-top: 12px; padding: 11px 16px; border-radius: var(--radius);
    background: var(--panel2); border: 1px solid var(--line);
    font-size: 15px; font-weight: 700; text-align: center; min-height: 44px;
}
.verdict .rate { color: var(--sae-red); }
.verdict .passe { color: var(--vert); }

footer { margin-top: 20px; color: var(--muted2); font-size: 12.5px; }

html.embed, html.embed body { height: 100%; overflow: hidden; }
html.embed .wrap { height: 100%; max-width: none; padding: 20px 18px 10px; display: flex; flex-direction: column; }
html.embed header { margin-bottom: 9px; padding-bottom: 7px; }
html.embed h1 { font-size: 23px; }
html.embed .sub, html.embed footer { display: none; }
html.embed .scene { flex: 1; min-height: 0; display: flex; flex-direction: column; }
html.embed .scene canvas { flex: 1; min-height: 0; object-fit: contain; }
</style>
</head>
<body>
<div class="wrap">

<header>
    <div>
        <h1>Un saut qui <span class="hl">fait envie</span></h1>
        <p class="sub">Deux coureurs, le même niveau, <b>la même touche au même instant</b>.
            Celui du haut n'a aucune ficelle, celui du bas en a une. C'est la seule
            différence — et elle décide qui passe.</p>
    </div>
</header>

<div class="tabs" id="tabs"></div>

<div class="scene">
    <canvas id="toile" width="900" height="330"></canvas>
    <div class="barre">
        <button class="go" id="rejouer">Rejouer</button>
        <p class="consigne" id="consigne"></p>
    </div>
</div>

<p class="verdict" id="verdict">&nbsp;</p>

<footer>SAE Institute Genève — GPR-CF-SBD-06, les ficelles d'un platformer.</footer>

</div>

const images = POSES.map((src) => { const i = new Image(); i.src = src; return i; });

// ---------------------------------------------------------------- la physique
const SOL = 250;
const VX = 190;            // px/s
const IMPULSION = 430;     // px/s
const G = 1500;            // px/s²
const COYOTE = 0.12;       // s
const TAMPON = 0.15;       // s
const PAS = 1 / 240;       // le pas des sondes, fixe

function neuf(plats, ficelles) {
    return {plats, f: ficelles, x: 40, y: SOL, vy: 0, sol: true,
            coyote: 0, tampon: 0, tombe: false, fini: false, trace: []};
}

function surPlateforme(c) {
    return c.plats.some(([a, b]) => c.x >= a && c.x <= b);
}

function avancer(c, dt, presse, relache) {
    if (c.fini) return;
    c.x += VX * dt;

    if (presse) {
        if (c.sol || (c.f.coyote && c.coyote > 0)) { c.vy = -IMPULSION; c.sol = false; c.coyote = 0; }
        else if (c.f.buffer) c.tampon = TAMPON;
    }
    if (c.tampon > 0 && c.sol) { c.vy = -IMPULSION; c.sol = false; c.tampon = 0; }
    if (relache && c.f.variable && c.vy < -140) c.vy = -140;

    if (!c.sol) {
        const g = (c.f.asym && c.vy > 0) ? G * 2.1 : G;
        c.vy += g * dt;
        c.y += c.vy * dt;
        if (c.y >= SOL) {
            if (surPlateforme(c)) { c.y = SOL; c.vy = 0; c.sol = true; }
            else if (c.y > SOL + 110) { c.tombe = true; c.fini = true; }
        }
    } else if (!surPlateforme(c)) {
        c.sol = false;
        c.coyote = COYOTE;
    }

    if (c.coyote > 0) c.coyote -= dt;
    if (c.tampon > 0) c.tampon -= dt;
    if (c.x > 880) c.fini = true;
    c.trace.push([c.x, c.y]);
}

// Rejoue une course entiere avec une liste d'appuis, et rend ce qu'on veut savoir.
function simuler(plats, ficelles, appuis) {
    const c = neuf(plats, ficelles);
    let t = 0, quitte = 0, atterrit = 0, sommet = SOL;
    while (t < 9 && !c.fini) {
        const avant = t, etaitSol = c.sol;
        t += PAS;
        const presse = appuis.some((a) => avant < a.t && t >= a.t);
        const relache = appuis.some((a) => a.rel != null && t >= a.t + a.rel);
        avancer(c, PAS, presse, relache);
        if (etaitSol && !c.sol && !quitte) quitte = avant;
        if (quitte && !atterrit && !etaitSol && c.sol) atterrit = t;
        sommet = Math.min(sommet, c.y);
    }
    return {c, quitte, atterrit, sommet: Math.round(SOL - sommet)};
}

// ---------------------------------------------------------------- les scenarios
// Chaque scenario a son niveau et ses appuis ; les instants sont calcules ici,
// une fois, par des sondes — rien n'est ecrit en dur.
const NIVEAUX = {
    coyote: [[0, 300], [380, 900]],
    buffer: [[0, 260], [340, 380], [465, 900]],
    variable: [[0, 900]],
    asym: [[0, 900]]
};

function appuisDe(cle) {
    if (cle === "coyote") {
        const q = simuler(NIVEAUX.coyote, {}, []).quitte;
        return [{t: q + 0.08}];                       // 80 ms trop tard
    }
    if (cle === "buffer") {
        const q = simuler(NIVEAUX.buffer, {}, []).quitte;
        const a = simuler(NIVEAUX.buffer, {}, [{t: q}]).atterrit;
        return [{t: q}, {t: a - 0.10}];               // le second, 100 ms trop tot
    }
    if (cle === "variable") return [{t: 0.6, rel: 0.07}];
    return [{t: 0.6}];
}

const SCENARIOS = {
    coyote: {
        onglet: "J'ai appuyé trop tard",
        ficelle: "coyote", nom: "coyote time",
        consigne: "La touche part <b>80 ms après</b> avoir quitté le bord. Sans coyote time, " +
                  "le saut n'a jamais lieu : le personnage n'est déjà plus au sol."
    },
    buffer: {
        onglet: "J'ai appuyé trop tôt",
        ficelle: "buffer", nom: "jump buffer",
        consigne: "Le second appui part <b>100 ms avant</b> de toucher la plateforme du " +
                  "milieu. Sans jump buffer, il est perdu — et le trou suivant arrive."
    },
    variable: {
        onglet: "J'ai juste tapé la touche",
        ficelle: "variable", nom: "hauteur variable",
        consigne: "La touche est relâchée après <b>70 ms</b>. Sans hauteur variable, le saut " +
                  "part toujours au maximum : impossible de faire un petit saut."
    },
    asym: {
        onglet: "Le saut est mou",
        ficelle: "asym", nom: "gravité asymétrique",
        consigne: "Même impulsion, même appui. Avec une gravité <b>deux fois plus forte à " +
                  "la descente</b>, la courbe se penche et le saut devient nerveux."
    }
};

for (const cle of Object.keys(SCENARIOS)) {
    SCENARIOS[cle].plats = NIVEAUX[cle];
    SCENARIOS[cle].appuis = appuisDe(cle);
}

// ---------------------------------------------------------------- le rendu
const toile = document.getElementById("toile");
const ctx = toile.getContext("2d");
const $ = (id) => document.getElementById(id);

let scenario = "coyote";
let pistes = [];
let temps = 0;
let anim = null;

function lancer() {
    const s = SCENARIOS[scenario];
    pistes = [
        {c: neuf(s.plats, {}), titre: "sans " + s.nom, dy: 0, couleur: "#E30613"},
        {c: neuf(s.plats, {[s.ficelle]: true}), titre: "avec " + s.nom, dy: 160, couleur: "#2e9e5b"}
    ];
    temps = 0;
    $("verdict").innerHTML = "&nbsp;";
    if (anim) cancelAnimationFrame(anim);
    const t0 = performance.now();
    anim = requestAnimationFrame((t) => boucle(t0, t));
    dessiner();
}

function boucle(t0, t1) {
    const dt = Math.min(0.033, (t1 - t0) / 1000);
    const avant = temps;
    temps += dt;
    const appuis = SCENARIOS[scenario].appuis;

    for (const p of pistes) {
        const presse = appuis.some((a) => avant < a.t && temps >= a.t);
        const relache = appuis.some((a) => a.rel != null && temps >= a.t + a.rel);
        avancer(p.c, dt, presse, relache);
    }
    dessiner();

    if (pistes.every((p) => p.c.fini) || temps > 8) { verdict(); return; }
    anim = requestAnimationFrame((t) => boucle(t1, t));
}

function dessiner() {
    ctx.clearRect(0, 0, toile.width, toile.height);
    for (const p of pistes) piste(p);
}

function piste(p) {
    const base = 10 + p.dy;        // haut de la bande, dans la toile
    const haut = base - (SOL - 150);

    ctx.save();
    ctx.translate(0, haut);

    ctx.fillStyle = "#1a1a1a";
    for (const [a, b] of p.c.plats) ctx.fillRect(a, SOL, b - a, 12);

    ctx.strokeStyle = p.couleur;
    ctx.globalAlpha = 0.4;
    ctx.lineWidth = 2;
    ctx.beginPath();
    p.c.trace.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.stroke();
    ctx.globalAlpha = 1;

    const img = images[Math.floor(temps * 12) % images.length];
    const h = 44, w = h * ((img.naturalWidth / img.naturalHeight) || 1);
    if (img.complete && img.naturalWidth) ctx.drawImage(img, p.c.x - w / 2, p.c.y - h, w, h);
    else { ctx.fillStyle = p.couleur; ctx.fillRect(p.c.x - 11, p.c.y - 38, 22, 38); }

    ctx.restore();

    ctx.fillStyle = p.couleur;
    ctx.font = "800 14px Inter, sans-serif";
    ctx.fillText(p.titre, 10, base + 14);
}

function verdict() {
    const [sans, avec] = pistes.map((p) => p.c);
    const s = SCENARIOS[scenario];

    if (scenario === "asym" || scenario === "variable") {
        const hs = simuler(s.plats, {}, s.appuis).sommet;
        const ha = simuler(s.plats, {[s.ficelle]: true}, s.appuis).sommet;
        $("verdict").innerHTML = scenario === "variable"
            ? "Même appui : <b>" + hs + " px</b> de haut sans la ficelle, <b>" + ha +
              " px</b> avec. En haut, la touche tapée vaut la touche tenue."
            : "Même hauteur — <b>" + hs + " px</b> contre <b>" + ha +
              " px</b> — mais regardez les courbes : celle du bas retombe deux fois plus vite.";
        return;
    }

    $("verdict").innerHTML =
        (sans.tombe ? '<span class="rate">Sans ' + s.nom + " : tombé.</span>"
                    : "Sans " + s.nom + " : passé.") + " &nbsp;·&nbsp; " +
        (avec.tombe ? '<span class="rate">Avec : tombé aussi.</span>'
                    : '<span class="passe">Avec ' + s.nom + " : passé.</span>");
}

// ---------------------------------------------------------------- les onglets
$("tabs").innerHTML = Object.entries(SCENARIOS)
    .map(([k, s]) => '<button data-k="' + k + '">' + s.onglet + "</button>").join("");

function montrer(k) {
    if (!SCENARIOS[k]) k = "coyote";
    scenario = k;
    document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.k === k));
    $("consigne").innerHTML = SCENARIOS[k].consigne;
    lancer();
}

$("tabs").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    history.replaceState(null, "", "#" + b.dataset.k);
    montrer(b.dataset.k);
});
$("rejouer").addEventListener("click", lancer);
addEventListener("hashchange", () => montrer(location.hash.slice(1)));



if (document.documentElement.classList.contains("embed")){
    document.addEventListener("keydown", function(e){
        if (e.target.closest("input, select, textarea")) return;
        const m = {ArrowRight: "right", ArrowLeft: "left", ArrowDown: "down", ArrowUp: "up", PageDown: "next", PageUp: "prev"}[e.key];
        if (!m) return;
        e.preventDefault();
        try { window.parent.postMessage(JSON.stringify({method: m, args: []}), "*"); } catch (_) {}
    });
