<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" font-family="Inter, Segoe UI, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E30613"/></marker><marker id="head-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e6e"/></marker></defs>
<rect width="1000" height="320" fill="#ffffff"/>
<rect x="80.0" y="105.0" width="220.0" height="70.0" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="190.0" y="146.0" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">int pv = 42</text>
<text x="190.0" y="200.0" text-anchor="middle" font-size="13" font-weight="600" fill="#555555" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">une valeur : on peut calculer</text>
<rect x="650.0" y="105.0" width="60.0" height="70.0" rx="0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="680.0" y="149.0" text-anchor="middle" font-size="20" font-weight="800" fill="#1a1a1a" font-family="JetBrains Mono, Consolas, monospace">'4'</text>
<rect x="710.0" y="105.0" width="60.0" height="70.0" rx="0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="740.0" y="149.0" text-anchor="middle" font-size="20" font-weight="800" fill="#1a1a1a" font-family="JetBrains Mono, Consolas, monospace">'2'</text>
<text x="710.0" y="91.0" text-anchor="middle" font-size="15" font-weight="800" fill="#1a1a1a" font-family="JetBrains Mono, Consolas, monospace" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">std::string "42"</text>
<text x="710.0" y="200.0" text-anchor="middle" font-size="13" font-weight="600" fill="#555555" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">deux caractères : on peut afficher</text>
<path d="M310.0,115.0 L480.0,95.0 L636.0,115.0" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head-ink)"/>
<text x="475.0" y="82.0" text-anchor="middle" font-size="16" font-weight="800" fill="#1a1a1a" font-family="JetBrains Mono, Consolas, monospace" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">std::to_string(pv)</text>
<text x="475.0" y="128.0" text-anchor="middle" font-size="12" font-weight="600" fill="#555555" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">réussit toujours</text>
<path d="M636.0,168.0 L480.0,188.0 L310.0,168.0" fill="none" stroke="#E30613" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head-red)"/>
<text x="475.0" y="212.0" text-anchor="middle" font-size="16" font-weight="800" fill="#E30613" font-family="JetBrains Mono, Consolas, monospace" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">std::stoi(texte)</text>
<text x="475.0" y="164.0" text-anchor="middle" font-size="12" font-weight="700" fill="#E30613" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">peut échouer</text>
<path d="M40.0,240.0 L960.0,240.0" fill="none" stroke="#6e6e6e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.35"/>
<text x="40.0" y="266.0" text-anchor="start" font-size="13" font-weight="800" fill="#E30613" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">LE RETOUR ÉCHOUE</text>
<text x="230.0" y="266.0" text-anchor="start" font-size="15" font-weight="800" fill="#1a1a1a" font-family="JetBrains Mono, Consolas, monospace" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">"abc"</text>
<text x="230.0" y="290.0" text-anchor="start" font-size="13" font-weight="700" fill="#E30613" font-family="JetBrains Mono, Consolas, monospace" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">→ invalid_argument</text>
<text x="480.0" y="266.0" text-anchor="start" font-size="15" font-weight="800" fill="#1a1a1a" font-family="JetBrains Mono, Consolas, monospace" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">""</text>
<text x="480.0" y="290.0" text-anchor="start" font-size="13" font-weight="700" fill="#E30613" font-family="JetBrains Mono, Consolas, monospace" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">→ invalid_argument</text>
<text x="730.0" y="266.0" text-anchor="start" font-size="15" font-weight="800" fill="#1a1a1a" font-family="JetBrains Mono, Consolas, monospace" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">"99999999999"</text>
<text x="730.0" y="290.0" text-anchor="start" font-size="13" font-weight="700" fill="#E30613" font-family="JetBrains Mono, Consolas, monospace" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">→ out_of_range</text>
<text x="40.0" y="312.0" text-anchor="start" font-size="13" font-weight="600" fill="#555555" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">piège : stoi("42abc") rend 42 sans erreur — il s'arrête au premier caractère non chiffre</text>
</svg>
