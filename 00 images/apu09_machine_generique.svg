<text x="780.0" y="338.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">machine.Tick(dt)</text>
<text x="780.0" y="384.0" text-anchor="middle" font-size="14" font-weight="600" fill="#6e6e6e" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">chaque frame : la machine teste les conditions et change d'état seule</text>
