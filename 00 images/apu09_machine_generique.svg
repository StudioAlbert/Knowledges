<text x="562.0" y="112.0" text-anchor="start" font-size="15" font-weight="600" fill="#1a1a1a" font-family="JetBrains Mono, Consolas, monospace">machine.ChangeState(idle);</text>
<text x="562.0" y="180.0" text-anchor="start" font-size="15" font-weight="600" fill="#1a1a1a" font-family="JetBrains Mono, Consolas, monospace">machine.AddTransition(idle, patrol, AttenteFinie);</text>
<text x="562.0" y="214.0" text-anchor="start" font-size="15" font-weight="600" fill="#1a1a1a" font-family="JetBrains Mono, Consolas, monospace">machine.AddTransition(patrol, idle, PointAtteint);</text>
<text x="562.0" y="248.0" text-anchor="start" font-size="15" font-weight="600" fill="#E30613" font-family="JetBrains Mono, Consolas, monospace">machine.AddAnyTransition(alarm, JoueurVu);</text>
<text x="780.0" y="56.0" text-anchor="middle" font-size="15" font-weight="700" fill="#555555" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">ce qu'on écrit une fois, dans Awake</text>
