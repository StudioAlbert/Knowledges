<text x="293.0" y="237.0" text-anchor="middle" font-size="13" font-weight="600" fill="#E30613" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">joueur vu</text>
<text x="280.0" y="60.0" text-anchor="middle" font-size="14" font-weight="700" fill="#E30613" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">depuis n'importe quel état</text>
