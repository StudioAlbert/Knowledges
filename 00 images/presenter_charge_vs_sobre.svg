<text x="38" y="88" transform="rotate(-4 38 88)" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-size="34" fill="#ffe600" stroke="#c00000" stroke-width="1.2" paint-order="stroke">MY AWESOME PROJECT!!!</text>
<polygon points="447.0,39.0 451.9,48.6 460.5,42.1 460.7,52.8 471.2,50.7 466.8,60.5 477.2,63.1 469.0,70.0 477.2,76.9 466.8,79.5 471.2,89.3 460.7,87.2 460.5,97.9 451.9,91.4 447.0,101.0 442.1,91.4 433.5,97.9 433.3,87.2 422.8,89.3 427.2,79.5 416.8,76.9 425.0,70.0 416.8,63.1 427.2,60.5 422.8,50.7 433.3,52.8 433.5,42.1 442.1,48.6" fill="#b6ff00" stroke="#ff00c8" stroke-width="1.5"/>
<text x="447" y="75" transform="rotate(12 447 70)" text-anchor="middle" font-family="'Comic Sans MS', cursive" font-size="13" font-weight="700" fill="#ff0000">NEW!!</text>
<g font-size="9" fill="#ffd0f0">
<text x="34" y="114">So basically I started this project because I wanted to learn Unity and also C++ at</text>
<text x="34" y="126.5">the same time, and I watched a LOT of tutorials about shaders and physics and also</text>
<text x="34" y="139">procedural generation which is really cool, and then I tried to write my own engine</text>
<text x="34" y="151.5">but it was too hard so I went back to Unity and made a character controller with a</text>
<text x="34" y="164">double jump and a dash and a wall jump, then I added enemies but they had bugs so I</text>
<text x="34" y="176.5">spent two weeks fixing them and I also learned Git (kind of) and Blender for the 3D</text>
<text x="34" y="189">models and textures, and next I want to add multiplayer, a skill tree, crafting, an</text>
<text x="34" y="201.5">open world, online leaderboards, mod support and maybe a VR version if I have time,</text>
<text x="34" y="214">and also a level editor and a soundtrack that I will compose myself in FL Studio!!!</text>
</g>
<text x="34" y="252" font-family="'Comic Sans MS', cursive" font-size="13" fill="#1a3cff" text-decoration="underline">click here for more info →</text>
<text x="468" y="285" text-anchor="end" font-size="10" fill="#ffe600">1 / 47</text>
</g>
