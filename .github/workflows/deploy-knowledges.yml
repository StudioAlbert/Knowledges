name: Deploy knowledges

on:
  push:
    branches: [main]
    paths:
      - "01 courses/slides/**"
      - "01 courses/exercises/**"
      - "00 images/**"
      - "00 widgets/**"
      - "00 templates/css/**"
      - "site-build/**"
      - ".github/workflows/deploy-knowledges.yml"
  workflow_dispatch:

concurrency:
  group: deploy-knowledges
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site-build/package-lock.json

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Setup SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # --delete : le VPS reflète exactement dist/. Tout fichier posé à la main
      # dans /var/www/knowledges sera effacé au déploiement suivant.
      # Si la clé est restreinte par `rrsync -wo /var/www`, la cible devient `knowledges/`.
      # Permissions forcées en lecture pour tous (-p + --chmod) : `deploy` n'est pas
      # membre de www-data, le setgid ne survit donc pas aux chmod de rsync et les
      # fichiers finissent en deploy:deploy, illisibles par nginx en 750/640.
      # L'accès web reste protégé par le Basic Auth.
      - name: Rsync
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          rsync -rlptz --delete --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/id_ed25519" \
            dist/ "deploy@${VPS_HOST}:/var/www/knowledges/"
