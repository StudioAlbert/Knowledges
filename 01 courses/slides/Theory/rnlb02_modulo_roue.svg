<text x="300" y="257" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">3 bits</text>
<text x="300" y="287" text-anchor="middle" font-size="17" fill="#6e6e6e">2³ = 8 positions</text>
<text x="560" y="110" font-size="18" font-weight="800" fill="#1a1a1a">On garde les 3 bits du bas</text>
<line x1="560" y1="122" x2="860" y2="122" stroke="#E30613" stroke-width="3"/>
<text x="560" y="170" font-size="19" font-weight="700" fill="#1a1a1a">7 + 1</text>
<text x="560" y="198" font-size="16" font-family="JetBrains Mono, Consolas, monospace" fill="#6e6e6e">111 + 001 = 1 000</text>
<text x="710" y="226" font-size="16" font-family="JetBrains Mono, Consolas, monospace" font-weight="700" fill="#E30613">→ 000 = 0</text>
<text x="560" y="270" font-size="19" font-weight="700" fill="#1a1a1a">0 − 1</text>
<text x="560" y="298" font-size="16" font-family="JetBrains Mono, Consolas, monospace" fill="#6e6e6e">(1)000 − 001</text>
<text x="710" y="326" font-size="16" font-family="JetBrains Mono, Consolas, monospace" font-weight="700" fill="#E30613">→ 111 = 7</text>
<text x="560" y="370" font-size="19" font-weight="700" fill="#1a1a1a">5 + 6</text>
<text x="560" y="398" font-size="16" font-family="JetBrains Mono, Consolas, monospace" fill="#6e6e6e">101 + 110 = 1 011</text>
<text x="710" y="426" font-size="16" font-family="JetBrains Mono, Consolas, monospace" font-weight="700" fill="#E30613">→ 011 = 3</text>
<text x="560" y="475" font-size="15" fill="#6e6e6e">Retenue perdue à gauche, emprunt à un bit fictif.</text>
